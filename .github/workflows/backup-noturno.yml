name: Backup automático do Fluxo PF

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas
  workflow_dispatch: {}      # também dá para rodar na mão, pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Código do site
        uses: actions/checkout@v4

      - name: Repositório privado de backups (funciona mesmo vazio)
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$BACKUP_REPO_TOKEN" ]; then echo "ERRO: o segredo BACKUP_REPO_TOKEN não está cadastrado."; exit 1; fi
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/kleydsoncontador-svg/fluxo-pf-backups.git" backups-repo \
            || { echo "ERRO: não consegui acessar kleydsoncontador-svg/fluxo-pf-backups. Confira se o token tem acesso a ESSE repositório e permissão Contents = Read and write."; exit 1; }
          cd backups-repo && git checkout -B main

      - name: Rodar o backup
        env:
          SUPABASE_URL: https://zwcxheqcwtpevqcrrcws.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_DEST_DIR: ${{ github.workspace }}/backups-repo
        run: node scripts/backup.js

      - name: Guardar no repositório privado
        working-directory: backups-repo
        run: |
          git config user.name "Backup automático Fluxo PF"
          git config user.email "backup@fluxo-pf.local"
          git add .
          git diff --staged --quiet || git commit -m "Backup automático $(date -u +%Y-%m-%d_%Hh)"
          git push -u origin main

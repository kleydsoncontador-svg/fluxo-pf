name: Backup noturno (criptografado)
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Confere os segredos
        env:
          CHAVE: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then echo "Faltam os segredos SUPABASE_SERVICE_KEY e/ou BACKUP_SENHA (Settings > Secrets and variables > Actions)."; exit 1; fi
      - name: Baixa e criptografa
        env:
          CHAVE: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -e
          curl -sf "https://zwcxheqcwtpevqcrrcws.supabase.co/rest/v1/dados_app?select=*" -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" -o dados.json
          test "$(wc -c < dados.json)" -gt 100
          openssl enc -aes-256-cbc -pbkdf2 -salt -in dados.json -out backup.enc -pass env:SENHA
          rm dados.json
      - uses: actions/upload-artifact@v4
        with:
          name: fluxo-pf-backup-criptografado
          path: backup.enc
          retention-days: 90
